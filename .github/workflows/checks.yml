name: Checks

on:
  push:
    branches: ["26.3"]
  pull_request:
    branches: ["26.3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check runner assertions
        run: python .github/smoke-test.py --self-test
      - name: Run server regressions
        run: |
          chmod +x gradlew
          python .github/smoke-test.py --checks --online
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-check-logs
          if-no-files-found: ignore
          path: |
            build/local-smoke/*/*.log
            build/local-smoke/*/result.json
            build/local-smoke/*/server/crash-reports/*.txt
